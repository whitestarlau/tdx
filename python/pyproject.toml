[project]
name = "tdx-go"
version = "0.1.0"
description = "Python client for the Go tdx protocol library (pandas DataFrame, mootdx-style API)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdx_go*"]
